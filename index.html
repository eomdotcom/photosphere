<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photosphere - Upload data</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <span class="brand">Photosphere</span>
    <a href="index.html">Upload data</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

  <main>
    <h1>Upload Student Engagement Data</h1>
    <p>Load a CSV file containing student engagement data.</p>

    <!-- File upload -->
    <section class="upload-box">
      <label for="file">Choose a CSV file</label>
      <input type="file" id="file" accept=".csv">
    </section>

    <!-- Shows messages such as "Saved: 24 students" or an error -->
    <p id="status">No dataset loaded yet.</p>

    <!-- Buttons -->
    <button id="open-dashboard" disabled>Open the dashboard</button>
    <button id="delete-data">Delete the saved dataset</button>
  </main>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
<script type="module" src="upload.js"></script>

</body>
</html>
