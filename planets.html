<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photosphere - Dashboard (planets)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="planets.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <span class="brand">Photosphere</span>
    <a href="index.html">Upload data</a>
    <a href="dashboard.html" aria-current="page">Dashboard</a>
  </nav>

  <main class="dashboard-main">
    <!-- Title with the List | Planets switch beside it -->
    <div class="page-head">
      <h1>Dashboard</h1>
      <nav class="view-switch" aria-label="Dashboard view">
        <a href="dashboard.html">List</a>
        <a href="planets.html" aria-current="page">Planets</a>
      </nav>
    </div>

    <div class="pl-toolbar">
      <!-- Week buttons are built by planets.js from the week column (same as the dashboard) -->
      <div class="weeks" id="week-buttons"></div>

      <div class="pl-tools">
        <label class="pl-search">
          <span class="sr-only">Find a student</span>
          <input id="find" type="search" list="student-names" placeholder="Find a student" autocomplete="off">
          <datalist id="student-names"></datalist>
        </label>
        <div class="pl-zoom" role="group" aria-label="Show">
          <button class="pl-btn" id="zoom-in" data-count="all" aria-pressed="false">Everyone</button>
          <button class="pl-btn" id="zoom-out" data-count="near" aria-pressed="true">Near a zone line</button>
          <button class="pl-btn" id="lens-moved" data-count="moved" aria-pressed="false">Changed zone</button>
        </div>
      </div>
    </div>

    <!-- Only shows search results or warnings; counts are on the buttons (hover) -->
    <div class="summary" id="planet-status" aria-live="polite"></div>

    <div class="pl-layout">
      <!-- The planets (drawn by planets.js) -->
      <div class="pl-stage" id="stage-wrap">
        <svg id="stage" viewBox="0 10 1200 590" role="group"
             aria-label="Zones shown as planets. Each student chip is a link to their details."></svg>
        <div class="pl-tip" id="tip" role="presentation"></div>
        <!-- Team credit, same corner in every planet view -->
        <p class="chart-ref" aria-hidden="true"><span class="chart-ref-mark"></span>Team FourCast</p>
      </div>

      <!-- Students in view, as a list (filled by planets.js) -->
      <aside class="pl-side" aria-label="Students in view">
        <div class="pl-side-inner" id="side"></div>
      </aside>
    </div>

    <!-- How to read this (shared with every page; filled by help.js) -->
    <div id="help-strip" data-page="planets"></div>
  </main>

  <script type="module" src="planets.js"></script>
  <script type="module" src="help.js"></script>
</body>
</html>
